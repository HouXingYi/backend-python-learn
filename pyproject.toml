[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-learn"
version = "0.1.0"
description = "A small Python project for learning."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Your Name" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8"
]

[project.scripts]
app = "app.main:main"

[tool.setuptools.packages.find]
where = ["src"]
