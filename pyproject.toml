[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-learn"
version = "0.1.0"
description = "A small Python project for learning."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Your Name" }
]
dependencies = [
    "deepagents>=0.6.0",
    "fastapi[standard]>=0.128.0",
    "langchain-openai>=1.0.0",
    "pydantic-settings>=2.0.0",
    "pymysql>=1.1.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8"
]

[project.scripts]
app = "app.main:main"
app-dev = "app.dev:main"

[tool.setuptools.packages.find]
where = ["src"]
